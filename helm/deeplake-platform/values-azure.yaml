# Azure / AKS overlay. Prerequisites: docs/install.md

global:
  cloud: azure

  # Mirror images here for air-gapped installs.
  # imageRegistry: mycompany.azurecr.io

  storage:
    # az://<storage-account>/<container>/<prefix>
    rootPath: ""

  workloadIdentity:
    enabled: true
    azure:
      clientId: ""
      tenantId: ""

  ingress:
    # AKS app routing add-on. Use "nginx" if you run ingress-nginx yourself,
    # or "azure-application-gateway" for AGIC.
    className: webapprouting.kubernetes.azure.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true

  storageClass: managed-csi

dlpg:
  pool:
    # Images are multi-arch; x86 node pools are fine.
    nodeSelector: {}
    tolerations: []
