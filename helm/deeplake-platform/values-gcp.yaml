# GCP / GKE overlay. Prerequisites: docs/install.md

global:
  cloud: gcp

  storage:
    # gs://<bucket>/<prefix>
    rootPath: ""

  workloadIdentity:
    enabled: true
    gcp:
      # <name>@<project>.iam.gserviceaccount.com
      serviceAccount: ""

  ingress:
    className: gce
    annotations: {}
    tls:
      enabled: true

  storageClass: pd-balanced
