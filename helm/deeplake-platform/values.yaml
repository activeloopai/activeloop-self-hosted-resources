# =============================================================================
# deeplake-platform — self-hosted Deep Lake
# =============================================================================
# Everything a customer must set is in `global`; sections below it are tuning.
# Keys marked REQUIRED have no working default — the install fails without them.
#
#   helm install deeplake . -f values-azure.yaml -f my-values.yaml
#
# Full walkthrough, including the cloud prerequisites: docs/install.md
# =============================================================================

global:
  # -- REQUIRED. Drives workload identity, ingress class, and StorageClass.
  # One of: azure | aws | gcp
  cloud: azure

  # -- Registry for ALL images, including subcharts.
  imageRegistry: quay.io
  imagePullSecrets: []
  # - regcred

  fullnameOverride: ""

  # -- REQUIRED. UI at this host, API at api.<domain>, Keycloak at kc.<domain>.
  # All of them must resolve from inside the cluster too, not just publicly.
  domain: deeplake.example.com

  storage:
    # -- REQUIRED. Dataset root; scheme must match `cloud`.
    # az://<account>/<container>/<prefix> | s3://<bucket>/<prefix> | gs://<bucket>/<prefix>
    rootPath: ""

  # -- Cloud identity for pods that touch object storage. Fill in the block
  # matching `cloud`. The identity also needs a federated credential for
  # system:serviceaccount:<namespace>:<release>-workload — without it, storage
  # access fails at token exchange, not at startup. See docs/install.md step 2.
  workloadIdentity:
    enabled: true
    azure:
      clientId: ""
      tenantId: ""
    aws:
      roleArn: ""
    gcp:
      serviceAccount: ""

  # -- Shared by deeplake-api and the dlpg pool; subcharts only reference it.
  serviceAccount:
    create: true
    name: ""

  ingress:
    enabled: true
    # Empty -> per-cloud default (see charts/deeplake-common/templates/_cloud.tpl)
    className: ""
    annotations: {}
    tls:
      enabled: true
      # Pre-created TLS secret. Leave empty to let cert-manager issue one via
      # the annotations above.
      secretName: ""

  # Empty -> per-cloud default (managed-csi / gp3 / pd-balanced)
  storageClass: ""

  # -- OIDC. Any compliant provider works; endpoints come from discovery.
  # `audience` must match what the provider stamps into the token's aud claim,
  # and normally tracks `domain` — change one, change the other.
  auth:
    # oidc | auth0. "oidc" drives the generic adapter in both the API and UI.
    provider: oidc
    # e.g. https://keycloak.example.com/realms/deeplake
    issuerUrl: ""
    audience: https://api.deeplake.example.com
    uiClientId: deeplake-ui
    cliClientId: deeplake-cli
    oidc:
      scope: "openid profile email"
      # Keycloak identity-provider aliases for social/enterprise login.
      # For an enterprise install this is typically the customer's Entra ID.
      googleIdpHint: ""
      githubIdpHint: ""
      # Keycloak's is kc_idp_hint; other providers use a different param.
      idpHintParam: kc_idp_hint
      # prompt-create | login
      registerMode: prompt-create
    # Air-gapped installs can skip the discovery call, but must then supply
    # every endpoint explicitly.
    disableDiscovery: false
    jwksUrl: ""
    deviceAuthUrl: ""
    tokenUrl: ""

  # -- Bundled control-plane Postgres. Off by default; point global.database at
  # your own server instead. Not the pg-deeplake data plane, which is always
  # in-cluster. Tuning lives in the top-level `postgres:` section.
  postgres:
    enabled: false

  # -- Bundled Keycloak. Off by default: point global.auth.issuerUrl at your
  # existing Keycloak, Entra ID, Okta or any other OIDC provider instead.
  # When enabled, global.auth.issuerUrl is derived and may be left empty.
  keycloak:
    enabled: false
    # Empty -> kc.<global.domain>
    hostname: ""
    realm: deeplake
    # Keys: username, password. Bootstrap admin for the master realm.
    adminSecret: deeplake-keycloak-admin
    registrationAllowed: true
    # Password reset needs working SMTP; off until you configure one.
    resetPasswordAllowed: false
    # Stamps email_verified=true on every token. The API rejects unverified
    # users, and without SMTP nobody can verify. Turn off once SMTP works.
    forceEmailVerified: true
    # Realm import runs once, at first startup, and skips a realm that already
    # exists. Edit clients in the admin console after that.
    importRealm: true

  # -- REQUIRED. Secret names; the chart never generates credentials, so create
  # these before installing. See docs/install.md step 3 for the commands.
  secrets:
    # Keys: JWT_SECRET, DB_PASSWORD, CREDENTIALS_ENCRYPTION_KEY.
    # Without CREDENTIALS_ENCRYPTION_KEY the API silently disables managed
    # credentials and repositories, so bring-your-own-cloud storage stops working.
    api: deeplake-api-secrets
    # Keys: password  (the pg-deeplake superuser)
    dlpg: deeplake-dlpg-superuser

  # -- API service port. Under `global` because the dlpg pool pods need it too.
  api:
    servicePort: 80

  # -- pg-deeplake wire TLS. Off by default because it needs a certificate;
  # while off, SDK clients are told sslmode=disable, because pg-proxy genuinely
  # does not offer SSL and telling them otherwise breaks every connection.
  # Turn this on for production.
  dlpg:
    tls:
      enabled: false
      secretName: ""

  # -- Address SDK clients get from /db-credentials. Must resolve for them.
  dlpgExternalHost: ""

  # -- OpenFGA. REQUIRED: deeplake-api will not serve without it. Either enable
  # the bundled one below, or point `url` at your own. Tuning lives in the
  # top-level `openfga:` section.
  openfga:
    enabled: false
    # Empty -> the bundled service. Set to reach an external OpenFGA.
    url: ""
    # Secret with key `token`, shared by the API client and the bundled server.
    # Empty -> no authentication (in-cluster trials only).
    tokenSecret: ""
    # Store and model IDs are generated at creation time and cannot be pinned,
    # so a Job creates them and writes the IDs to `bootstrap.secretName`.
    bootstrap:
      enabled: true
      secretName: deeplake-openfga-ids
      image: curlimages/curl:8.11.1

  # -- REQUIRED. Control-plane Postgres (org/user metadata), not the pg-deeplake
  # data plane. `host` does NOT default to the bundled Postgres — set it to
  # <release>-postgres when global.postgres.enabled is true, and set sslMode to
  # `disable`, since the bundled server serves no TLS.
  database:
    host: ""
    port: 5432
    name: deeplake
    user: deeplake
    sslMode: require

# =============================================================================

deeplake-api:
  enabled: true

deeplake-ui:
  enabled: true

dlpg:
  enabled: true

# =============================================================================

# Bundled Postgres tuning. Enable it via global.postgres.enabled.
postgres:
  image: postgres:18
  # ClusterIP by default. LoadBalancer exposes the control-plane database for
  # admin access — restrict it, and prefer an internal LB:
  #   annotations:
  #     service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  service:
    type: ClusterIP
    annotations: {}
    loadBalancerSourceRanges: []
  storage: 32Gi
  databases: [deeplake, keycloak, openfga]
  resources:
    requests:
      cpu: "250m"
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeSelector: {}

# Bundled Keycloak tuning. Enable it via global.keycloak.enabled.
keycloak:
  image: quay.io/keycloak/keycloak:26.7.0
  # Keycloak clusters over Infinispan; >1 replica needs jgroups discovery set up.
  replicas: 1
  database:
    # Empty -> the bundled postgres when enabled, otherwise global.database.host
    host: ""
    port: 5432
    name: keycloak
    user: ""
    # Keys: password. Empty -> global.secrets.api (key DB_PASSWORD)
    passwordSecret: ""
    passwordSecretKey: ""
  resources:
    requests:
      cpu: "250m"
      memory: 768Mi
    limits:
      memory: 2Gi
  nodeSelector: {}

# Bundled OpenFGA tuning. Enable it via global.openfga.enabled.
openfga:
  image: openfga/openfga:v1.8.0
  replicas: 1
  database:
    # Empty -> the bundled postgres when enabled, otherwise global.database.host
    host: ""
    port: 5432
    name: openfga
    user: ""
    # Keys: password. Empty -> global.secrets.api (key DB_PASSWORD)
    passwordSecret: ""
    passwordSecretKey: ""
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}

# Bundled ingress controller. Off by default; set global.ingress.className to
# your existing one.
ingress-nginx:
  enabled: false

# Your own resources, rendered as-is. Values are templated, so {{ }} works.
extraManifests: []
extraManifestsRaw: []
