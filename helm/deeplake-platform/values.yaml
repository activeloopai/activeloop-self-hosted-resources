# =============================================================================
# deeplake-platform — self-hosted Deep Lake
# =============================================================================
# This file is the customer-facing contract. Everything a customer must set is
# in `global`. Component sections below are tuning, not required reading.
#
# Start from one of the cloud overlays:
#   helm install deeplake . -f values-azure.yaml -f my-values.yaml
# =============================================================================

global:
  # -- Target cloud. Drives workload identity, ingress class, and StorageClass.
  # One of: azure | aws | gcp
  cloud: azure

  # -- Container registry for ALL images (including subcharts). Point this at
  imageRegistry: quay.io
  imagePullSecrets: []
  # - regcred

  fullnameOverride: ""

  # -- Base domain. The UI is served at this host, the API at api.<domain>.
  domain: deeplake.example.com

  storage:
    # -- Object-storage root for all dataset data. Scheme must match `cloud`:
    rootPath: ""

  # -- Cloud identity for pods that touch object storage. Strongly preferred
  workloadIdentity:
    enabled: true
    azure:
      clientId: ""
      tenantId: ""
    aws:
      roleArn: ""
    gcp:
      serviceAccount: ""

  # -- Single ServiceAccount shared by deeplake-api and the dlpg pool. Created
  # once by this umbrella chart; subcharts only reference it by name.
  serviceAccount:
    create: true
    name: ""

  ingress:
    enabled: true
    # Empty -> per-cloud default (see charts/deeplake-common/templates/_cloud.tpl)
    className: ""
    annotations: {}
    tls:
      enabled: true
      # Pre-created TLS secret. Leave empty to let cert-manager issue one via
      # the annotations above.
      secretName: ""

  # Empty -> per-cloud default (managed-csi / gp3 / pd-balanced)
  storageClass: ""

  # -- OIDC. Any compliant provider works; the API resolves all endpoints from
  auth:
    # oidc | auth0. "oidc" drives the generic adapter in both the API and UI.
    provider: oidc
    # e.g. https://keycloak.example.com/realms/deeplake
    issuerUrl: ""
    audience: https://api.deeplake.example.com
    uiClientId: deeplake-ui
    cliClientId: deeplake-cli
    oidc:
      scope: "openid profile email"
      # Keycloak identity-provider aliases for social/enterprise login.
      # For an enterprise install this is typically the customer's Entra ID.
      googleIdpHint: ""
      githubIdpHint: ""
      # Keycloak's is kc_idp_hint; other providers use a different param.
      idpHintParam: kc_idp_hint
      # prompt-create | login
      registerMode: prompt-create
    # Air-gapped installs can skip the discovery call, but must then supply
    # every endpoint explicitly.
    disableDiscovery: false
    jwksUrl: ""
    deviceAuthUrl: ""
    tokenUrl: ""

  # -- Secrets. This chart NEVER generates or stores credentials. Create these
  secrets:
    # Keys: JWT_SECRET, DB_PASSWORD, and optionally
    #       CREDENTIALS_ENCRYPTION_KEY
    api: deeplake-api-secrets
    # Keys: password  (the pg-deeplake superuser)
    dlpg: deeplake-dlpg-superuser

  # -- API service port. Lives under `global` because the dlpg pool pods need
  api:
    servicePort: 80

  # -- Address SDK clients receive from /db-credentials. Must be resolvable
  dlpgExternalHost: ""

  # -- OpenFGA. Store and model IDs are generated by OpenFGA at creation time,
  openfga:
    url: ""
    apiToken: ""
    bootstrap:
      enabled: true
      secretName: deeplake-openfga-ids
      image: curlimages/curl:8.11.1

  # -- Control-plane Postgres (org/user metadata). This is NOT the pg-deeplake
  database:
    host: ""
    port: 5432
    name: deeplake
    user: deeplake
    sslMode: require

# =============================================================================

deeplake-api:
  enabled: true

deeplake-ui:
  enabled: true

dlpg:
  enabled: true

# =============================================================================

# In-cluster Postgres for control-plane metadata. Off by default; point
# global.database at your own server instead. Not the pg-deeplake data plane,
# which always runs in-cluster.
postgres:
  enabled: false
  image: postgres:18
  storage: 32Gi
  databases: [deeplake, keycloak, openfga]
  resources:
    requests:
      cpu: "250m"
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeSelector: {}

# Bundled ingress controller. Off by default; set global.ingress.className to
# your existing one.
ingress-nginx:
  enabled: false

# Your own resources, rendered as-is. Values are templated, so {{ }} works.
extraManifests: []
extraManifestsRaw: []
