{{- $g := .Values.global -}}
{{- if $g.openfga.enabled }}
{{- $v := .Values.openfga -}}
{{- $name := printf "%s-openfga" (include "deeplake.fullname" .) -}}
{{- $dbHost := $v.database.host | default (ternary (printf "%s-postgres" (include "deeplake.fullname" .)) $g.database.host $g.postgres.enabled) -}}
{{- if not $dbHost }}
{{- fail "openfga.database.host is required (or enable global.postgres.enabled, or set global.database.host)" }}
{{- end }}
{{- $dbUser := $v.database.user | default $g.database.user -}}
{{- $dbSecret := $v.database.passwordSecret | default (required "global.secrets.api is required" $g.secrets.api) -}}
{{- $dbKey := $v.database.passwordSecretKey | default "DB_PASSWORD" -}}
{{- $sslMode := ternary "disable" $g.database.sslMode (and $g.postgres.enabled (not $v.database.host)) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
    app.kubernetes.io/component: openfga
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "deeplake.selectorLabels" (dict "ctx" . "component" "openfga") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deeplake.selectorLabels" (dict "ctx" . "component" "openfga") | nindent 8 }}
    spec:
      {{- include "deeplake.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: migrate
          image: {{ $v.image }}
          args: ["migrate"]
          env:
            # DB_PASSWORD must precede the URI: $(VAR) only expands from
            # variables declared earlier in the list.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ $dbKey }}
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              value: {{ printf "postgres://%s:$(DB_PASSWORD)@%s:%v/%s?sslmode=%s" $dbUser $dbHost $v.database.port $v.database.name $sslMode | quote }}
      containers:
        - name: openfga
          image: {{ $v.image }}
          args: ["run"]
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          env:
            # DB_PASSWORD must precede the URI: $(VAR) only expands from
            # variables declared earlier in the list.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: {{ $dbKey }}
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_DATASTORE_URI
              value: {{ printf "postgres://%s:$(DB_PASSWORD)@%s:%v/%s?sslmode=%s" $dbUser $dbHost $v.database.port $v.database.name $sslMode | quote }}
            {{- if $g.openfga.tokenSecret }}
            - name: OPENFGA_AUTHN_METHOD
              value: preshared
            - name: OPENFGA_AUTHN_PRESHARED_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $g.openfga.tokenSecret }}
                  key: token
            {{- end }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
    app.kubernetes.io/component: openfga
spec:
  type: ClusterIP
  selector:
    {{- include "deeplake.selectorLabels" (dict "ctx" . "component" "openfga") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 8081
      targetPort: grpc
{{- end }}
