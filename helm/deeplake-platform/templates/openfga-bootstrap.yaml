{{- if .Values.global.openfga.bootstrap.enabled }}
{{- /*
  Everything here is a Helm hook, run on install (after the release's
  resources exist, OpenFGA may be one of them) and on upgrade (BEFORE the
  new pods roll, so the API never starts against an authorization model older
  than it needs). The supporting objects are hooks too so that the model
  ConfigMap the Job mounts is the one from the chart being installed, not the
  previous release's, and so an upgrade that first turns the bootstrap on has
  a ServiceAccount to run as. Weights order them before the Job.
*/ -}}
{{- $name := printf "%s-fga-bootstrap" (include "deeplake.fullname" .) }}
{{- $apiDeployments := list (include "deeplake.componentName" (dict "ctx" . "component" "api-server")) (include "deeplake.componentName" (dict "ctx" . "component" "api-worker")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-model-files
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,post-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  model.json: |
{{ .Files.Get "files/openfga-model.json" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,post-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,post-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  # restart the API pods when a new model id is written (pods read it at start)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: {{ $apiDeployments | toJson }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,post-install
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
  annotations:
    # post-install so OpenFGA exists when it runs (it may be in this release),
    # pre-upgrade so a new authorization model is in the store, and its id in
    # the Secret, before any new API pod starts. a hook so a changed pod
    # template replaces the Job instead of failing the upgrade on an immutable
    # field.
    "helm.sh/hook": pre-upgrade,post-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "deeplake.selectorLabels" (dict "ctx" . "component" "fga-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $name }}
      containers:
        - name: bootstrap
          image: {{ .Values.global.openfga.bootstrap.image }}
          env:
            - name: FGA_URL
              value: {{ include "deeplake.openfgaUrl" . | quote }}
            - name: API_DEPLOYMENTS
              value: {{ join " " $apiDeployments | quote }}
            - name: SECRET_NAME
              value: {{ .Values.global.openfga.bootstrap.secretName | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.global.openfga.tokenSecret }}
            - name: FGA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: token
            {{- end }}
          volumeMounts:
            - name: model
              mountPath: /model
          command:
            - sh
            - -c
            - |
              set -eu
              KUBE=https://kubernetes.default.svc
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN=$(cat $SA/token)
              AUTH=""
              [ -n "${FGA_TOKEN:-}" ] && AUTH="-H \"Authorization: Bearer $FGA_TOKEN\""

              echo "waiting for OpenFGA at $FGA_URL"
              i=0
              until curl -sf -m 5 "$FGA_URL/healthz" >/dev/null 2>&1; do
                i=$((i+1)); [ $i -gt 60 ] && { echo "openfga not ready after 5m"; exit 1; }
                sleep 5
              done

              # Reads one key of the existing Secret, decoded. Empty when the
              # Secret or the key is missing.
              secret_key() {
                printf '%s' "$EXISTING" |
                  sed -n "s/.*\"$1\"[ ]*:[ ]*\"\([^\"]*\)\".*/\1/p" |
                  head -n1 | base64 -d 2>/dev/null || true
              }

              EXISTING=$(curl -sk -H "Authorization: Bearer $TOKEN" \
                "$KUBE/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME" 2>/dev/null || true)
              STORE=$(secret_key FGA_STORE_ID)
              CUR_MODEL=$(secret_key FGA_AUTHORIZATION_MODEL_ID)
              CUR_SHA=$(secret_key FGA_MODEL_SHA256)
              WANT_SHA=$(sha256sum /model/model.json | cut -d' ' -f1)

              # Idempotent: the model in the store is only rewritten when the
              # model this chart ships differs from the one last written.
              if [ -n "$STORE" ] && [ -n "$CUR_MODEL" ] && [ "$CUR_SHA" = "$WANT_SHA" ]; then
                echo "store=$STORE model=$CUR_MODEL already current; nothing to do"
                exit 0
              fi

              if [ -z "$STORE" ]; then
                echo "creating store"
                STORE=$(curl -sf -m 30 -X POST "$FGA_URL/stores" \
                  ${FGA_TOKEN:+-H "Authorization: Bearer $FGA_TOKEN"} \
                  -H 'Content-Type: application/json' -d '{"name":"deeplake"}' \
                  | sed -n 's/.*"id"[ ]*:[ ]*"\([^"]*\)".*/\1/p')
                [ -n "$STORE" ] || { echo "failed to create store"; exit 1; }
              else
                echo "using existing store $STORE (model was ${CUR_MODEL:-unset})"
              fi

              # A new model is an addition: existing tuples stay valid, and the
              # previous API keeps working on it.
              echo "writing authorization model"
              MODEL=$(curl -sf -m 60 -X POST "$FGA_URL/stores/$STORE/authorization-models" \
                ${FGA_TOKEN:+-H "Authorization: Bearer $FGA_TOKEN"} \
                -H 'Content-Type: application/json' --data-binary @/model/model.json \
                | sed -n 's/.*"authorization_model_id"[ ]*:[ ]*"\([^"]*\)".*/\1/p')
              [ -n "$MODEL" ] || { echo "failed to write model"; exit 1; }

              echo "store=$STORE model=$MODEL"
              B64_STORE=$(printf '%s' "$STORE" | base64 | tr -d '\n')
              B64_MODEL=$(printf '%s' "$MODEL" | base64 | tr -d '\n')
              B64_SHA=$(printf '%s' "$WANT_SHA" | base64 | tr -d '\n')

              BODY="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"$SECRET_NAME\"},\"data\":{\"FGA_STORE_ID\":\"$B64_STORE\",\"FGA_AUTHORIZATION_MODEL_ID\":\"$B64_MODEL\"}}"
              CODE=$(curl -sk -o /tmp/out -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                "$KUBE/api/v1/namespaces/$NAMESPACE/secrets" -d "$BODY")
              if [ "$CODE" = "409" ]; then
                CODE=$(curl -sk -o /tmp/out -w '%{http_code}' -X PATCH \
                  -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/merge-patch+json' \
                  "$KUBE/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME" -d "$BODY")
              fi
              case "$CODE" in
                2*) echo "wrote $SECRET_NAME" ;;
                *)  echo "failed to write secret: $CODE"; cat /tmp/out; exit 1 ;;
              esac

              # The pods read the model id when they start, so restart the API
              # Deployments by changing a pod template annotation. A Deployment
              # that does not exist yet (fresh install) starts with the right
              # id anyway.
              for D in $API_DEPLOYMENTS; do
                URL="$KUBE/apis/apps/v1/namespaces/$NAMESPACE/deployments/$D"
                CODE=$(curl -sk -o /tmp/out -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL")
                case "$CODE" in
                  404) echo "deployment $D not found; skipping restart"; continue ;;
                  2*) ;;
                  *)  echo "failed to read deployment $D: $CODE"; cat /tmp/out; exit 1 ;;
                esac
                PATCH="{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"deeplake.ai/fga-model-id\":\"$MODEL\"}}}}}"
                CODE=$(curl -sk -o /tmp/out -w '%{http_code}' -X PATCH \
                  -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/strategic-merge-patch+json' \
                  "$URL" -d "$PATCH")
                case "$CODE" in
                  2*) echo "restarting $D on model $MODEL" ;;
                  *)  echo "failed to patch deployment $D: $CODE"; cat /tmp/out; exit 1 ;;
                esac
              done

              # Recorded last: a failure above makes the retry redo the restart
              # instead of seeing a current model and skipping it.
              CODE=$(curl -sk -o /tmp/out -w '%{http_code}' -X PATCH \
                -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/merge-patch+json' \
                "$KUBE/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME" \
                -d "{\"data\":{\"FGA_MODEL_SHA256\":\"$B64_SHA\"}}")
              case "$CODE" in
                2*) echo "recorded model sha" ;;
                *)  echo "failed to record model sha: $CODE"; cat /tmp/out; exit 1 ;;
              esac
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: model
          configMap:
            name: {{ $name }}-model-files
{{- end }}
