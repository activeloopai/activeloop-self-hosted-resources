{{- include "deeplake.validateCloud" . -}}
{{- if .Values.global.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "deeplake.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
  annotations:
    {{- include "deeplake.serviceAccountAnnotations" . | nindent 4 }}
{{- end }}
