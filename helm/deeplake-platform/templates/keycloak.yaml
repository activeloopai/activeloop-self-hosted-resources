{{- $g := .Values.global -}}
{{- if $g.keycloak.enabled }}
{{- $v := .Values.keycloak -}}
{{- $name := printf "%s-keycloak" (include "deeplake.fullname" .) -}}
{{- $scheme := ternary "https" "http" $g.ingress.tls.enabled -}}
{{- $dbHost := $v.database.host | default (ternary (printf "%s-postgres" (include "deeplake.fullname" .)) $g.database.host .Values.postgres.enabled) -}}
{{- if not $dbHost }}
{{- fail "keycloak.database.host is required (or enable postgres.enabled, or set global.database.host)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: {{ $v.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "deeplake.selectorLabels" (dict "ctx" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/realm: {{ include (print $.Template.BasePath "/keycloak-realm.yaml") . | sha256sum }}
      labels:
        {{- include "deeplake.selectorLabels" (dict "ctx" . "component" "keycloak") | nindent 8 }}
    spec:
      {{- include "deeplake.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: keycloak
          image: {{ $v.image }}
          args:
            - start
            {{- if $g.keycloak.importRealm }}
            - --import-realm
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://%s:%v/%s" $dbHost $v.database.port $v.database.name | quote }}
            - name: KC_DB_USERNAME
              value: {{ $v.database.user | default $g.database.user | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $v.database.passwordSecret | default (required "global.secrets.api is required" $g.secrets.api) }}
                  key: {{ $v.database.passwordSecretKey | default "DB_PASSWORD" }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $g.keycloak.adminSecret }}
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $g.keycloak.adminSecret }}
                  key: password
            # Pins the iss claim; without it Keycloak derives it from the request host.
            - name: KC_HOSTNAME
              value: {{ printf "%s://%s" $scheme (include "deeplake.keycloakHost" .) | quote }}
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          volumeMounts:
            {{- if $g.keycloak.importRealm }}
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 15
      volumes:
        {{- if $g.keycloak.importRealm }}
        - name: realm
          configMap:
            name: {{ printf "%s-keycloak-realm" (include "deeplake.fullname" .) }}
        {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: ClusterIP
  selector:
    {{- include "deeplake.selectorLabels" (dict "ctx" . "component" "keycloak") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
