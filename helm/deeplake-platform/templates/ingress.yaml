{{- $g := .Values.global -}}
{{- if $g.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "deeplake.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
  {{- with $g.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ include "deeplake.ingressClassName" . }}
  {{- if $g.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $g.domain | quote }}
        - {{ printf "api.%s" $g.domain | quote }}
      {{- if $g.ingress.tls.secretName }}
      secretName: {{ $g.ingress.tls.secretName }}
      {{- else }}
      # No secret named: cert-manager issues one from the annotations above.
      secretName: {{ printf "%s-tls" (include "deeplake.fullname" .) }}
      {{- end }}
  {{- end }}
  rules:
    {{- if (index .Values "deeplake-ui").enabled }}
    - host: {{ $g.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "deeplake.componentName" (dict "ctx" . "component" "ui") }}
                port:
                  number: {{ (index .Values "deeplake-ui").service.port }}
    {{- end }}
    {{- if (index .Values "deeplake-api").enabled }}
    - host: {{ printf "api.%s" $g.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "deeplake.componentName" (dict "ctx" . "component" "api-server") }}
                port:
                  number: {{ .Values.global.api.servicePort }}
    {{- end }}
{{- end }}
