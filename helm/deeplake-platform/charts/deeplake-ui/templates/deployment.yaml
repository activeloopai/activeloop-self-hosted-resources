{{- $v := .Values -}}
{{- $g := .Values.global -}}
{{- $scheme := ternary "https" "http" $g.ingress.tls.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deeplake.componentName" (dict "ctx" . "component" "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  {{- if not $v.autoscaling.enabled }}
  replicas: {{ $v.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "deeplake.selectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deeplake.selectorLabels" (dict "ctx" . "component" "ui") | nindent 8 }}
      {{- with $v.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "deeplake.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        # Matches the distroless nonroot image (gcr.io/distroless/nodejs20-debian12:nonroot).
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: ui
          image: {{ include "deeplake.image" (dict "ctx" . "image" $v.image) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $v.service.targetPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ $v.service.targetPort | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: production

            # --- Browser-facing config (plain names -> window.__ENV) ---
            - name: API_BASE_URL
              value: {{ printf "%s://api.%s" $scheme $g.domain | quote }}

            # --- Auth provider selection (server-side only) ---
            {{- if eq $g.auth.provider "oidc" }}
            - name: AUTH_PROVIDER
              value: "oidc"
            - name: OIDC_ISSUER
              value: {{ required "global.auth.issuerUrl is required" $g.auth.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ $g.auth.uiClientId | quote }}
            - name: OIDC_AUDIENCE
              value: {{ $g.auth.audience | quote }}
            {{- with $g.auth.oidc.scope }}
            - name: OIDC_SCOPE
              value: {{ . | quote }}
            {{- end }}
            {{- with $g.auth.oidc.googleIdpHint }}
            - name: OIDC_GOOGLE_IDP_HINT
              value: {{ . | quote }}
            {{- end }}
            {{- with $g.auth.oidc.githubIdpHint }}
            - name: OIDC_GITHUB_IDP_HINT
              value: {{ . | quote }}
            {{- end }}
            {{- with $g.auth.oidc.idpHintParam }}
            # Keycloak uses kc_idp_hint (the default); other providers differ.
            - name: OIDC_IDP_HINT_PARAM
              value: {{ . | quote }}
            {{- end }}
            {{- with $g.auth.oidc.registerMode }}
            - name: OIDC_REGISTER_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- else }}
            # Auth0 (legacy). These are NEXT_PUBLIC_* and are normally inlined
            # at image build time; set here only if the image was built without
            # them baked in.
            - name: AUTH_PROVIDER
              value: "auth0"
            {{- end }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "deeplake.componentName" (dict "ctx" . "component" "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ $v.service.type }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "deeplake.selectorLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
