{{- $v := .Values -}}
{{- if $v.podUptimeRbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "deeplake.componentName" (dict "ctx" . "component" "poduptime") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "deeplake.componentName" (dict "ctx" . "component" "poduptime") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "deeplake.componentName" (dict "ctx" . "component" "poduptime") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "deeplake.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
