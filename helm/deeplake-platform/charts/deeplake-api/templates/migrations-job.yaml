{{- $v := .Values -}}
{{- $g := .Values.global -}}
{{- if $v.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "deeplake.componentName" (dict "ctx" . "component" "migrate") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deeplake.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # pre-install normally, so the schema is ready before anything serves. With
    # the bundled Postgres there is nothing to migrate yet at pre-install time —
    # it is a main-phase resource — so run after it exists and wait for it.
    "helm.sh/hook": {{ if $g.postgres.enabled }}post-install,post-upgrade{{ else }}pre-install,pre-upgrade{{ end }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ $v.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "deeplake.selectorLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      # Deliberately not the workload-identity SA: this only runs DB migrations,
      # and as a pre-install hook it would run before that SA exists.
      {{- include "deeplake.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      {{- if $g.postgres.enabled }}
      initContainers:
        - name: wait-for-db
          image: {{ include "deeplake.image" (dict "ctx" . "image" (dict "registry" $v.image.registry "repository" $v.image.repository "tag" $v.image.setupTag)) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 120); do
                nc -z {{ $g.database.host }} {{ $g.database.port }} && exit 0
                sleep 2
              done
              echo "timed out waiting for {{ $g.database.host }}:{{ $g.database.port }}" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "deeplake.image" (dict "ctx" . "image" (dict "registry" $v.image.registry "repository" $v.image.repository "tag" $v.image.setupTag)) }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          env:
            {{- include "deeplake-api.env" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ required "global.secrets.api is required" $g.secrets.api }}
          resources:
            {{- toYaml $v.migrations.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
