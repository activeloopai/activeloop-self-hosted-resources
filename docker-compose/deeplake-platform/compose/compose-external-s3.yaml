x-openfga-env: &openfga-env
  environment:
    OPENFGA_DATASTORE_ENGINE: postgres
    OPENFGA_DATASTORE_URI: postgres://openfga:${PG_OPENFGA_PASSWORD}@postgres:5432/openfga?sslmode=disable
    OPENFGA_LOG_FORMAT: json
    OPENFGA_AUTHN_METHOD: preshared
    OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_AUTH_KEY}
x-deeplake-api-env: &deeplake-api-env
  environment:
    OTEL_ENABLED: false
    OIDC_ISSUER: https://kc.${BASE_HOST}/realms/deeplake
    OIDC_AUDIENCE: https://api.${BASE_HOST}
    OIDC_CLI_CLIENT_ID: deeplake-cli
    APP_BASE_URL: https://app.${BASE_HOST}
    CORS_ALLOW_ORIGINS: "*"
    DB_HOST: postgres
    DB_HOST_RO: postgres
    DB_NAME: deeplake
    DB_PASSWORD: ${PG_DEEPLAKE_PASSWORD}
    DB_PORT: 5432
    DB_USER: deeplake
    CREDENTIALS_ENCRYPTION_KEY: ${DEEPLAKE_CREDS_KEY}
    DEEPLAKE_ROOT_DIR: ${DEEPLAKE_ROOT_DIR}
    DEEPLAKE_ROOT_PATH: ${DEEPLAKE_ROOT_PATH}
    FGA_API_TOKEN: ${OPENFGA_AUTH_KEY}
    FGA_API_URL: http://openfga:8080
    FGA_AUTHN_METHOD: api_token
    FGA_AUTHORIZATION_MODEL_ID: fga_authorization_model_id
    FGA_STORE_ID: fga_store_id
    JWT_DECODE_LEEWAY: "30"
    JWT_SECRET: ${DEEPLAKE_JWT_KEY}
    LOG_FORMAT: json
    LOG_LEVEL: info
    PORT: "8080"
    SHARED_DLPG_HOST: pg-proxy
    SHARED_DLPG_PASSWORD: ${DLPG_PASSWORD}
    SHARED_DLPG_PORT: "5432"
    SHARED_DLPG_USER: postgres
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    S3_REGION: ${S3_REGION}
x-deeplake-env: &deeplake-env
  environment:
    PGDATA: /var/lib/postgresql/data
    POSTGRES_PASSWORD: ${DLPG_PASSWORD}
    POSTGRES_USER: postgres
    DEEPLAKE_API_URL: http://deeplake-api:8080
    DEEPLAKE_ROOT_PATH: ${DEEPLAKE_ROOT_PATH}
    DEEPLAKE_SNAPSHOT_RESTORE_ON_CLAIM: "1"
    DEEPLAKE_DATASET_WAL: "1"
    AWS_REGION: ${AWS_REGION}
    AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

networks:
  deeplake:
    driver: bridge

services:
  postgres:
    image: postgres:18
    container_name: dl-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${PG_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    configs:
      - target: /docker-entrypoint-initdb.d/provision.sql
        source: postgres_provision
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks:
      - deeplake

  migrate_openfga:
    depends_on:
      postgres:
        condition: service_healthy
    image: openfga/openfga:v1.8.5
    container_name: dl-migrate-openfga
    command: migrate
    networks:
      - deeplake
    <<: *openfga-env

  openfga:
    depends_on:
      migrate_openfga:
        condition: service_completed_successfully
    image: openfga/openfga:v1.8.5
    container_name: dl-openfga
    hostname: openfga
    restart: unless-stopped
    command: run
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - deeplake
    <<: *openfga-env

  keycloak:
    depends_on:
      postgres:
        condition: service_healthy
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: dl-keycloak
    hostname: keycloak
    restart: unless-stopped
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${PG_KEYCLOAK_PASSWORD}
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_URL_PORT: "5432"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: kc.${BASE_HOST}
    command:
      - start
      - --http-enabled
      - "true"
      - --import-realm
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'exec 3<>/dev/tcp/127.0.0.1/9000; echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q UP <&3',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - deeplake
    configs:
      - source: keycloak
        target: /opt/keycloak/data/import/realm.json

  deeplake-ui:
    image: quay.io/activeloopai/deeplake-ui:self-hosted
    container_name: dl-deeplake-ui
    hostname: deeplake-ui
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      AUTH_PROVIDER: oidc
      OIDC_ISSUER: https://kc.${BASE_HOST}/realms/deeplake
      OIDC_CLIENT_ID: deeplake-ui
      API_BASE_URL: https://api.${BASE_HOST}
    networks:
      - deeplake

  deeplake-api:
    depends_on:
      deeplake-setup:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    image: quay.io/activeloopai/deeplake-api:server-self-hosted
    container_name: dl-deeplake-api
    hostname: deeplake-api
    restart: unless-stopped
    networks:
      - deeplake
    <<: *deeplake-api-env

  deeplake-worker:
    depends_on:
      deeplake-setup:
        condition: service_completed_successfully
    image: quay.io/activeloopai/deeplake-api:worker-self-hosted
    container_name: dl-deeplake-worker
    hostname: deeplake-worker
    restart: unless-stopped
    networks:
      - deeplake
    <<: *deeplake-api-env

  deeplake-setup:
    image: quay.io/activeloopai/deeplake-api:setup-self-hosted
    container_name: dl-deeplake-setup
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deeplake
    <<: *deeplake-api-env

  deeplake-indexer:
    image: quay.io/activeloopai/pg-deeplake-stateless:18
    container_name: dl-deeplake-indexer
    hostname: deeplake-indexer
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        touch /tmp/.pg_deeplake_sync_disabled && exec /usr/local/bin/stateless-entrypoint.sh
    volumes:
      - deeplake_indexer:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - deeplake
    <<: *deeplake-env

  deeplake-stateless:
    image: quay.io/activeloopai/pg-deeplake-stateless:18
    container_name: dl-deeplake-stateless
    hostname: deeplake-stateless
    restart: unless-stopped
    volumes:
      - deeplake_stateless:/var/lib/postgresql
    entrypoint:
      - sh
      - -c
      - |
        touch /tmp/.pg_deeplake_sync_disabled /tmp/.pg_deeplake_indexer_disabled && exec /usr/local/bin/stateless-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - deeplake
    <<: *deeplake-env

  pg-proxy:
    depends_on:
      deeplake-stateless:
        condition: service_healthy
    image: quay.io/activeloopai/pg-proxy:latest
    container_name: dl-pg-proxy
    hostname: pg-proxy
    restart: unless-stopped
    environment:
      LOCAL_PODS: "deeplake-stateless:5432"
      CONTROL_POD_ADDR: "deeplake-stateless:5432"
      PG_PASSWORD: ${DLPG_PASSWORD}
      PG_USER: "postgres"
      LISTEN_ADDR: ":5432"
    networks:
      - deeplake

  caddy:
    image: caddy:2-alpine
    container_name: dl-caddy
    hostname: caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    configs:
      - target: /etc/caddy/Caddyfile
        source: caddy
      - target: /certs/fullchain.pem
        source: caddy_public_key
      - target: /certs/privkey.pem
        source: caddy_private_key
    volumes:
      - caddy:/data
    networks:
      - deeplake

volumes:
  caddy:
    driver: local
    name: dl_deeplake_caddy
  postgres:
    driver: local
    name: dl_deeplake_postgres
  deeplake_indexer:
    driver: local
    name: dl_deeplake_indexer
  deeplake_stateless:
    driver: local
    name: dl_deeplake_stateless

configs:
  postgres_provision:
    content: |
      CREATE USER deeplake WITH PASSWORD '${PG_DEEPLAKE_PASSWORD}';
      CREATE USER keycloak WITH PASSWORD '${PG_KEYCLOAK_PASSWORD}';
      CREATE USER openfga WITH PASSWORD '${PG_OPENFGA_PASSWORD}';
      CREATE DATABASE deeplake OWNER deeplake;
      CREATE DATABASE keycloak OWNER keycloak;
      CREATE DATABASE openfga OWNER openfga;
      GRANT ALL PRIVILEGES ON DATABASE deeplake TO deeplake;
      GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
      GRANT ALL PRIVILEGES ON DATABASE openfga TO openfga;
  caddy_public_key:
    file: caddy_public_key_file
  caddy_private_key:
    file: caddy_private_key_file
  caddy:
    content: |
      {
      	admin off
      }

      openfga.${BASE_HOST} {
      	tls /certs/fullchain.pem /certs/privkey.pem
      	reverse_proxy openfga:8080
      }

      kc.${BASE_HOST} {
      	tls /certs/fullchain.pem /certs/privkey.pem
      	reverse_proxy keycloak:8080
      }

      app.${BASE_HOST} {
      	tls /certs/fullchain.pem /certs/privkey.pem
      	reverse_proxy deeplake-ui:3000
      }

      api.${BASE_HOST} {
      	tls /certs/fullchain.pem /certs/privkey.pem
      	reverse_proxy deeplake-api:8080
      }

  keycloak:
    content: |
      {
        "clients": [
          {
            "attributes": {
              "pkce.code.challenge.method": "S256"
            },
            "clientId": "deeplake-ui",
            "consentRequired": false,
            "directAccessGrantsEnabled": false,
            "enabled": true,
            "protocolMappers": [
              {
                "config": {
                  "access.token.claim": "true",
                  "id.token.claim": "false",
                  "included.client.audience": "https://api.${BASE_HOST}"
                },
                "name": "deeplake-audience",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-audience-mapper"
              },
              {
                "config": {
                  "access.token.claim": "true",
                  "claim.name": "email_verified",
                  "claim.value": "true",
                  "id.token.claim": "true",
                  "jsonType.label": "boolean",
                  "userinfo.token.claim": "true"
                },
                "name": "email-verified-true",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-hardcoded-claim-mapper"
              }
            ],
            "publicClient": true,
            "redirectUris": [
              "https://app.${BASE_HOST}/*"
            ],
            "standardFlowEnabled": true,
            "webOrigins": [
              "https://app.${BASE_HOST}"
            ]
          },
          {
            "attributes": {
              "oauth2.device.authorization.grant.enabled": "true"
            },
            "clientId": "deeplake-cli",
            "consentRequired": false,
            "directAccessGrantsEnabled": false,
            "enabled": true,
            "protocolMappers": [
              {
                "config": {
                  "access.token.claim": "true",
                  "id.token.claim": "false",
                  "included.client.audience": "https://api.${BASE_HOST}"
                },
                "name": "deeplake-audience",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-audience-mapper"
              },
              {
                "config": {
                  "access.token.claim": "true",
                  "claim.name": "email_verified",
                  "claim.value": "true",
                  "id.token.claim": "true",
                  "jsonType.label": "boolean",
                  "userinfo.token.claim": "true"
                },
                "name": "email-verified-true",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-hardcoded-claim-mapper"
              }
            ],
            "publicClient": true,
            "standardFlowEnabled": false
          }
        ],
        "enabled": true,
        "loginWithEmailAllowed": true,
        "realm": "deeplake",
        "registrationAllowed": true,
        "resetPasswordAllowed": false,
        "verifyEmail": false
      }
